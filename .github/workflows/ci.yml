name : CI

on: [push]                          # run on every push

jobs:
  build-and-test:
    runs-on: ubuntu-latest          # a fresh Linux machine GitHub gives you

    steps:
      - name: Checkout code
        uses: actions/checkout@v4    # get your repo onto that machine

      - name: Set up JDK 21
        uses: actions/setup-java@v4  # install Java 21
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build and test
        run: ./mvnw clean verify     # compile + run all tests